site_name: Node System Documentation
site_url: https://lfg-incorporated.github.io/opensource-node-system-docs/
site_author: LFG-Incorporated
site_description: Documentation for the open-source nodesystem (node CLI, workload manager, backend, contracts, subgraphs, reward services)
repo_url: https://github.com/LFG-Incorporated/opensource-node-system-docs
repo_name: LFG-Incorporated/opensource-node-system-docs
copyright: Copyright &copy; 2026 LFG-Incorporated. Released under the MIT license
nav:
  - Overview:
    - index.md
    - self-hosting.md
  - Components:
    - node-cli.md
    - workload-manager.md
    - backend.md
    - contracts.md
    - subgraphs.md
    - workloads.md
    - master-and-rewards.md
    - dashboard.md
  - Reference:
    - fixed-names.md
    - security.md
  - Migration:
    - migration-from-lfg.md
theme: 
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - search.share
  favicon: assets/logo.png
  logo: assets/logo.png
  palette:
    - scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
plugins: 
  - search
markdown_extensions:
  - abbr
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true